<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Dashboard - Som Tam Thai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Task 1-0.1: Design Tokens & Theme File */
        :root {
            --bg-cream: #FDFBF7;
            --primary-green: #1A4D2E;
            --accent-terracotta: #E36414;
            --highlight-gold: #FFB703;
        }
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
        
        body { 
            background-color: var(--bg-cream); 
            font-family: 'DM Sans', sans-serif; 
            color: #333;
        }
        .display-font { 
            font-family: 'Lora', serif; 
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cream: '#FDFBF7',
                            green: '#1A4D2E',
                            terracotta: '#E36414',
                            gold: '#FFB703'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { ShoppingBag, User, Package, Calendar, ChevronRight, Edit2, LogOut, Clock, MapPin, X } = lucide;

        // Dummy Data
        const INITIAL_PROFILE = { name: "Ahmed", phone: "+960 789 2616" };
        
        const RECENT_ORDERS = [
            { id: "#STT-0042", date: "Today", total: 496.80, items: "Authentic Som Tam..." },
            { id: "#STT-0018", date: "15 Mar", total: 285.00, items: "Green Curry Chicken..." },
            { id: "#STT-0056", date: "28 Feb", total: 510.00, items: "Tom Yum Goong..." }
        ];

        // NavBar Component
        const NavBar = () => (
            <nav className="sticky top-0 z-50 bg-white shadow-sm px-4 py-3 flex justify-between items-center border-b border-gray-100">
                <div className="flex items-center gap-2">
                    <span className="display-font font-bold text-xl text-brand-green">Som Tam Thai</span>
                </div>
                <div className="hidden md:flex gap-6 font-medium text-sm">
                    <a href="index.html" className="text-gray-500 hover:text-brand-terracotta transition-colors">Menu</a>
                    <a href="reservations.html" className="hover:text-brand-terracotta transition-colors">Reservations</a>
                    <a href="orders.html" className="hover:text-brand-terracotta transition-colors">Orders</a>
                    <a href="account.html" className="text-brand-terracotta border-b-2 border-brand-terracotta pb-1">Account</a>
                </div>
                <div className="flex items-center gap-4">
                    <a href="cart.html" className="relative p-2 text-gray-500 hover:text-brand-green">
                        <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                    </a>
                </div>
            </nav>
        );

        // Footer Component
        const Footer = () => (
            <footer className="bg-brand-green text-brand-cream py-10 px-4 mt-12 pb-24 md:pb-10">
                <div className="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div>
                        <h4 className="display-font text-xl font-bold mb-4 text-brand-gold">Som Tam Thai</h4>
                        <p className="text-sm text-brand-cream/80 leading-relaxed mb-4">
                            Authentic Thai cuisine, scratch-cooked with fresh ingredients and traditional techniques.
                        </p>
                    </div>
                    <div>
                        <h4 className="font-bold mb-4">Contact Us</h4>
                        <ul className="space-y-2 text-sm text-brand-cream/80">
                            <li>📞 +960 789 2616</li>
                            <li>📍 Izzudhdheen Magu, Maafannu, Malé</li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold mb-4">Operating Hours</h4>
                        <ul className="space-y-2 text-sm text-brand-cream/80">
                            <li>Lunch: 11:30 - 15:30</li>
                            <li>Dinner: By Reservation Only</li>
                        </ul>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            const [profile, setProfile] = React.useState(INITIAL_PROFILE);
            const [isEditingName, setIsEditingName] = React.useState(false);
            
            const [upcomingReservation, setUpcomingReservation] = React.useState({
                id: "RES-2026-0417",
                date: "17 Apr 2026",
                time: "19:00",
                party: 2,
                table: "Table 1"
            });
            const [showCancelDialog, setShowCancelDialog] = React.useState(false);

            React.useEffect(() => {
                lucide.createIcons();
            });

            const handleSaveName = (e) => {
                e.preventDefault();
                setIsEditingName(false);
            };

            const handleCancelReservation = () => {
                setUpcomingReservation(null);
                setShowCancelDialog(false);
            };

            const handleLogout = () => {
                window.location.href = 'index.html';
            };

            return (
                <div className="min-h-screen flex flex-col bg-brand-cream relative">
                    <NavBar />

                    {/* Cancel Dialog Modal */}
                    {showCancelDialog && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
                                <h3 className="text-xl font-bold text-gray-900 mb-2">Cancel Reservation?</h3>
                                <p className="text-gray-600 text-sm mb-6">Are you sure you want to cancel your upcoming reservation? This action cannot be undone.</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setShowCancelDialog(false)} className="px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Keep It</button>
                                    <button onClick={handleCancelReservation} className="px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors">Yes, Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow max-w-5xl mx-auto w-full px-4 py-8">
                        
                        {/* Header Section */}
                        <div className="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
                            <div>
                                <h1 className="display-font text-3xl md:text-4xl font-bold text-gray-900">Welcome back, {profile.name}</h1>
                                <p className="text-gray-500 mt-2 font-medium">{profile.phone}</p>
                            </div>
                            
                            <button onClick={handleLogout} className="inline-flex items-center text-sm font-bold text-gray-500 hover:text-brand-terracotta transition-colors px-4 py-2 bg-white border border-gray-200 rounded-lg shadow-sm w-fit">
                                <i data-lucide="log-out" className="w-4 h-4 mr-2"></i> Sign Out
                            </button>
                        </div>

                        {/* Quick Action Cards Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                            <a href="orders.html" className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow flex items-center group">
                                <div className="w-12 h-12 bg-brand-green/10 text-brand-green rounded-full flex items-center justify-center mr-4 group-hover:bg-brand-green group-hover:text-white transition-colors">
                                    <i data-lucide="package" className="w-6 h-6"></i>
                                </div>
                                <div className="flex-1">
                                    <h3 className="font-bold text-gray-900 text-lg">Active Orders</h3>
                                    <p className="text-sm text-gray-500">1 order currently in progress</p>
                                </div>
                                <i data-lucide="chevron-right" className="w-5 h-5 text-gray-400 group-hover:text-brand-green"></i>
                            </a>

                            <a href="reservations.html" className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow flex items-center group">
                                <div className="w-12 h-12 bg-brand-terracotta/10 text-brand-terracotta rounded-full flex items-center justify-center mr-4 group-hover:bg-brand-terracotta group-hover:text-white transition-colors">
                                    <i data-lucide="calendar" className="w-6 h-6"></i>
                                </div>
                                <div className="flex-1">
                                    <h3 className="font-bold text-gray-900 text-lg">Upcoming Reservations</h3>
                                    <p className="text-sm text-gray-500">{upcomingReservation ? '1 booking confirmed' : 'No upcoming bookings'}</p>
                                </div>
                                <i data-lucide="chevron-right" className="w-5 h-5 text-gray-400 group-hover:text-brand-terracotta"></i>
                            </a>
                        </div>

                        <div className="flex flex-col lg:flex-row gap-8">
                            
                            {/* Left Column: Profile & Reservation */}
                            <div className="w-full lg:w-1/2 space-y-8">
                                
                                {/* Profile Card */}
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                                    <h2 className="text-xl font-bold text-gray-900 mb-6 flex items-center">
                                        <i data-lucide="user" className="w-5 h-5 mr-2 text-brand-terracotta"></i> My Profile
                                    </h2>
                                    
                                    <form onSubmit={handleSaveName} className="space-y-4">
                                        <div>
                                            <div className="flex justify-between items-center mb-1">
                                                <label className="block text-sm font-medium text-gray-700">Display Name</label>
                                                {!isEditingName && (
                                                    <button type="button" onClick={() => setIsEditingName(true)} className="text-xs text-brand-green font-bold flex items-center">
                                                        <i data-lucide="edit-2" className="w-3 h-3 mr-1"></i> Edit
                                                    </button>
                                                )}
                                            </div>
                                            {isEditingName ? (
                                                <div className="flex gap-2">
                                                    <input 
                                                        type="text" 
                                                        value={profile.name} 
                                                        onChange={(e) => setProfile({...profile, name: e.target.value})} 
                                                        className="flex-1 border border-brand-green ring-1 ring-brand-green rounded-lg p-2.5 text-sm focus:outline-none bg-white" 
                                                        autoFocus
                                                    />
                                                    <button type="submit" className="bg-brand-green text-white px-4 rounded-lg text-sm font-bold">Save</button>
                                                </div>
                                            ) : (
                                                <div className="border border-gray-200 rounded-lg p-2.5 text-sm bg-gray-50 text-gray-900 font-medium">
                                                    {profile.name}
                                                </div>
                                            )}
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Registered Phone</label>
                                            <div className="border border-gray-200 rounded-lg p-2.5 text-sm bg-gray-100 text-gray-500 cursor-not-allowed">
                                                {profile.phone}
                                            </div>
                                            <p className="text-xs text-gray-400 mt-1">Phone number cannot be changed.</p>
                                        </div>
                                    </form>
                                </div>

                                {/* Upcoming Reservation Card */}
                                {upcomingReservation && (
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                        <div className="bg-brand-green p-4 text-white flex justify-between items-center">
                                            <h2 className="font-bold flex items-center"><i data-lucide="calendar" className="w-4 h-4 mr-2"></i> Reserved Table</h2>
                                            <span className="text-xs bg-white/20 px-2 py-1 rounded font-bold tracking-wider uppercase">Confirmed</span>
                                        </div>
                                        <div className="p-6">
                                            <div className="grid grid-cols-2 gap-y-4 gap-x-2 mb-6 text-sm">
                                                <div>
                                                    <div className="text-gray-500 text-xs mb-0.5">Date</div>
                                                    <div className="font-bold text-gray-900">{upcomingReservation.date}</div>
                                                </div>
                                                <div>
                                                    <div className="text-gray-500 text-xs mb-0.5">Time</div>
                                                    <div className="font-bold text-gray-900">{upcomingReservation.time}</div>
                                                </div>
                                                <div>
                                                    <div className="text-gray-500 text-xs mb-0.5">Party Size</div>
                                                    <div className="font-bold text-gray-900">{upcomingReservation.party} People</div>
                                                </div>
                                                <div>
                                                    <div className="text-gray-500 text-xs mb-0.5">Booking ID</div>
                                                    <div className="font-medium text-gray-700">{upcomingReservation.id}</div>
                                                </div>
                                            </div>
                                            <button onClick={() => setShowCancelDialog(true)} className="w-full border border-red-200 text-red-600 hover:bg-red-50 font-bold py-2.5 rounded-lg text-sm transition-colors">
                                                Cancel Reservation
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Right Column: Recent Orders */}
                            <div className="w-full lg:w-1/2">
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                                    <div className="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                                        <h2 className="text-xl font-bold text-gray-900 flex items-center">
                                            <i data-lucide="clock" className="w-5 h-5 mr-2 text-brand-terracotta"></i> Recent Orders
                                        </h2>
                                        <a href="orders.html" className="text-sm font-bold text-brand-green hover:underline">View All</a>
                                    </div>

                                    <div className="space-y-4">
                                        {RECENT_ORDERS.map((order, idx) => (
                                            <div key={idx} className="flex justify-between items-center p-3 hover:bg-gray-50 rounded-lg transition-colors border border-transparent hover:border-gray-100">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="font-bold text-gray-900 text-sm">{order.id}</span>
                                                        <span className="text-xs text-gray-500">{order.date}</span>
                                                    </div>
                                                    <p className="text-xs text-gray-600 line-clamp-1">{order.items}</p>
                                                </div>
                                                <div className="text-right ml-4">
                                                    <div className="font-bold text-brand-green text-sm">MVR {order.total.toFixed(2)}</div>
                                                    <a href="orders.html" className="text-[10px] font-bold text-brand-terracotta uppercase tracking-wider hover:underline mt-1 inline-block">Details</a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <a href="index.html" className="mt-6 w-full bg-brand-green text-white font-bold py-3.5 rounded-lg shadow-sm transition-colors flex justify-center items-center text-sm hover:bg-green-900">
                                        Start a New Order
                                    </a>
                                </div>
                            </div>

                        </div>
                    </main>
                    
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
