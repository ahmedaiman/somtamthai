<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Som Tam Thai - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Task 1-0.1: Design Tokens & Theme File */
        :root {
            --bg-cream: #FDFBF7;
            --primary-green: #1A4D2E;
            --accent-terracotta: #E36414;
            --highlight-gold: #FFB703;
        }
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
        
        body { 
            background-color: var(--bg-cream); 
            font-family: 'DM Sans', sans-serif; 
            color: #333;
        }
        .display-font { 
            font-family: 'Lora', serif; 
        }
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cream: '#FDFBF7',
                            green: '#1A4D2E',
                            terracotta: '#E36414',
                            gold: '#FFB703'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Initialize Icons
        const { ShoppingBag, Calendar, User, Home, Plus, Info } = lucide;

        // Task 1-0.2: Dummy Data Module
        const OPERATING_HOURS = { isOpen: true, closesAt: "15:30" };
        const MENU_CATEGORIES = ["Salads", "Soups", "Curries", "Wok", "Specialty", "Noodles", "Rice", "Desserts", "Beverages"];
        const PRODUCTS = [
            { id: 1, category: "Salads", name: "Authentic Som Tam", desc: "Green papaya salad with chili, peanuts, and lime.", price: 120, isSoldOut: false },
            { id: 2, category: "Salads", name: "Larb Gai", desc: "Minced chicken salad with toasted rice powder.", price: 140, isSoldOut: false },
            { id: 3, category: "Soups", name: "Tom Yum Goong", desc: "Spicy and sour prawn soup with fresh lemongrass.", price: 180, isSoldOut: false },
            { id: 4, category: "Soups", name: "Tom Kha Gai", desc: "Coconut chicken soup with galangal.", price: 160, isSoldOut: false },
            { id: 5, category: "Curries", name: "Green Curry Chicken", desc: "Classic green curry with Thai eggplant and basil.", price: 170, isSoldOut: false },
            { id: 6, category: "Curries", name: "Massaman Beef", desc: "Rich and mild curry with tender beef and potatoes.", price: 220, isSoldOut: true },
            { id: 7, category: "Wok", name: "Pad Kra Pao", desc: "Holy basil stir-fry with minced pork and fried egg.", price: 150, isSoldOut: false },
            { id: 8, category: "Noodles", name: "Pad Thai", desc: "Stir-fried rice noodles with tamarind sauce and peanuts.", price: 160, isSoldOut: false },
            { id: 9, category: "Rice", name: "Pineapple Fried Rice", desc: "Jasmine rice stir-fried with pineapple and cashews.", price: 145, isSoldOut: false },
            { id: 10, category: "Desserts", name: "Mango Sticky Rice", desc: "Sweet coconut sticky rice with fresh ripe mango.", price: 110, isSoldOut: false },
            { id: 11, category: "Beverages", name: "Thai Iced Tea", desc: "Sweet creamy black tea over ice.", price: 65, isSoldOut: false },
        ];

        // Task 1-1.3: Customer Navigation Bar
        const NavBar = ({ cartCount }) => (
            <nav className="sticky top-0 z-50 bg-white shadow-sm px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-2">
                    <span className="display-font font-bold text-xl text-brand-green">Som Tam Thai</span>
                </div>
                <div className="hidden md:flex gap-6 font-medium text-sm">
                    <a href="index.html" className="text-brand-terracotta border-b-2 border-brand-terracotta pb-1">Menu</a>
                    <a href="reservations.html" className="hover:text-brand-terracotta transition-colors">Reservations</a>
                    <a href="orders.html" className="hover:text-brand-terracotta transition-colors">Orders</a>
                    <a href="account.html" className="hover:text-brand-terracotta transition-colors">Account</a>
                </div>
                <div className="flex items-center gap-4">
                    {OPERATING_HOURS.isOpen ? (
                        <span className="hidden md:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            Open Now
                        </span>
                    ) : (
                        <span className="hidden md:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">
                            Preorder
                        </span>
                    )}
                    <a href="cart.html" className="relative p-2 text-gray-600 hover:text-brand-green">
                        <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                        {cartCount > 0 && (
                            <span className="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-brand-terracotta rounded-full">
                                {cartCount}
                            </span>
                        )}
                    </a>
                </div>
            </nav>
        );

        // Task 1-1.4: Navigation Bar - Mobile
        const BottomNav = () => (
            <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 z-50">
                <a href="index.html" className="flex flex-col items-center text-brand-terracotta">
                    <i data-lucide="home" className="w-5 h-5"></i>
                    <span className="text-[10px] font-medium mt-1">Menu</span>
                </a>
                <a href="reservations.html" className="flex flex-col items-center text-gray-500 hover:text-brand-green">
                    <i data-lucide="calendar" className="w-5 h-5"></i>
                    <span className="text-[10px] font-medium mt-1">Book</span>
                </a>
                <a href="account.html" className="flex flex-col items-center text-gray-500 hover:text-brand-green">
                    <i data-lucide="user" className="w-5 h-5"></i>
                    <span className="text-[10px] font-medium mt-1">Account</span>
                </a>
            </div>
        );

        // Task 1-1.1: Menu Hero Banner
        const HeroBanner = () => (
            <div className="bg-brand-green text-white py-12 px-4 text-center relative overflow-hidden">
                <div className="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/food.png')]"></div>
                <div className="relative z-10 max-w-2xl mx-auto">
                    <h1 className="display-font text-4xl md:text-5xl font-bold mb-4 text-brand-cream">Som Tam Thai</h1>
                    <p className="text-lg md:text-xl text-brand-cream/90 mb-6">Authentic Thai, Scratch-Cooked – Maafannu, Malé.</p>
                    
                    <div className="inline-flex items-center px-4 py-2 rounded-full text-sm font-semibold shadow-sm bg-brand-gold text-brand-green">
                        {OPERATING_HOURS.isOpen ? `Open Now • Closes ${OPERATING_HOURS.closesAt}` : "Closed • Preorder for next service"}
                    </div>
                </div>
            </div>
        );

        // Task 1-1.2: Category Filter Tab Bar
        const CategoryTabs = () => (
            <div className="sticky top-[60px] z-40 bg-brand-cream/95 backdrop-blur border-b border-gray-200 py-3">
                <div className="max-w-7xl mx-auto px-4 overflow-x-auto hide-scroll">
                    <div className="flex space-x-6 w-max">
                        {MENU_CATEGORIES.map((cat, idx) => (
                            <a key={cat} href={`#${cat}`} className={`text-sm font-medium whitespace-nowrap pb-1 ${idx === 0 ? 'text-brand-terracotta border-b-2 border-brand-terracotta' : 'text-gray-600 hover:text-brand-green'}`}>
                                {cat}
                            </a>
                        ))}
                    </div>
                </div>
            </div>
        );

        // Task 1-1.3: Product Card Component
        const ProductCard = ({ product, onAdd }) => (
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow relative cursor-pointer group" onClick={() => window.location.href = `product.html?id=${product.id}`}>
                <div className="h-40 bg-gray-200 relative">
                    <div className="absolute inset-0 bg-gradient-to-tr from-brand-green/20 to-brand-gold/20 flex items-center justify-center text-4xl">
                        🍲
                    </div>
                    {product.isSoldOut && (
                        <div className="absolute inset-0 bg-white/70 backdrop-blur-sm flex items-center justify-center">
                            <span className="bg-gray-800 text-white px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase">Sold Out</span>
                        </div>
                    )}
                </div>
                <div className="p-4">
                    <h3 className="font-bold text-gray-900 mb-1 line-clamp-1">{product.name}</h3>
                    <p className="text-sm text-gray-500 mb-3 line-clamp-2 h-10">{product.desc}</p>
                    <div className="flex items-center justify-between mt-auto">
                        <span className="font-semibold text-brand-green">MVR {product.price}</span>
                        <button 
                            disabled={product.isSoldOut}
                            onClick={(e) => { e.stopPropagation(); onAdd(product); }}
                            className={`p-2 rounded-full flex items-center justify-center transition-colors ${product.isSoldOut ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-brand-terracotta text-white hover:bg-orange-700'}`}
                        >
                            <i data-lucide="plus" className="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        );

        // Task 1-1.6: Global Footer - Customer
        const Footer = () => (
            <footer className="bg-brand-green text-brand-cream py-10 px-4 mt-12 pb-24 md:pb-10">
                <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div>
                        <h4 className="display-font text-xl font-bold mb-4 text-brand-gold">Som Tam Thai</h4>
                        <p className="text-sm text-brand-cream/80 leading-relaxed mb-4">
                            Authentic Thai cuisine, scratch-cooked with fresh ingredients and traditional techniques.
                        </p>
                    </div>
                    <div>
                        <h4 className="font-bold mb-4">Contact Us</h4>
                        <ul className="space-y-2 text-sm text-brand-cream/80">
                            <li><a href="tel:+9607892616" className="hover:text-brand-gold transition-colors">📞 +960 789 2616</a></li>
                            <li>📍 Izzudhdheen Magu, Maafannu, Malé, Maldives</li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold mb-4">Operating Hours</h4>
                        <ul className="space-y-2 text-sm text-brand-cream/80">
                            <li>Lunch: 11:30 - 15:30</li>
                            <li>Dinner: By Reservation Only</li>
                            <li className="mt-4"><a href="#" className="underline hover:text-brand-gold transition-colors">Order via Foodie App</a></li>
                        </ul>
                    </div>
                </div>
                <div className="max-w-7xl mx-auto mt-8 pt-8 border-t border-brand-cream/20 text-center text-xs text-brand-cream/50">
                    &copy; 2026 Som Tam Thai. All rights reserved.
                </div>
            </footer>
        );

        // Main Application / Task 1-1.4: Home / Menu Page - Full Assembly
        const App = () => {
            const [cartCount, setCartCount] = React.useState(0);

            React.useEffect(() => {
                lucide.createIcons();
            });

            const handleAddToCart = (product) => {
                setCartCount(prev => prev + 1);
                alert(`${product.name} added to cart!`);
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    <NavBar cartCount={cartCount} />
                    <HeroBanner />
                    
                    {/* Preorder Alert Banner */}
                    {!OPERATING_HOURS.isOpen && (
                        <div className="bg-amber-50 border-l-4 border-amber-400 p-4 m-4 max-w-7xl mx-auto rounded flex items-start">
                            <i data-lucide="info" className="w-5 h-5 text-amber-400 mr-3 mt-0.5"></i>
                            <div>
                                <h3 className="text-amber-800 font-medium">We're currently closed</h3>
                                <p className="text-amber-700 text-sm mt-1">You are viewing our menu in preorder mode. Orders placed now will be scheduled for our next service window.</p>
                            </div>
                        </div>
                    )}

                    <CategoryTabs />

                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 py-8 space-y-12">
                        {MENU_CATEGORIES.map(category => {
                            const categoryProducts = PRODUCTS.filter(p => p.category === category);
                            if (categoryProducts.length === 0) return null;

                            return (
                                <section key={category} id={category} className="scroll-mt-32">
                                    <h2 className="display-font text-2xl font-bold mb-6 text-brand-green border-b border-gray-200 pb-2">
                                        {category}
                                    </h2>
                                    {/* Responsive Grid Layout */}
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                                        {categoryProducts.map(product => (
                                            <ProductCard key={product.id} product={product} onAdd={handleAddToCart} />
                                        ))}
                                    </div>
                                </section>
                            );
                        })}
                    </main>

                    <Footer />
                    <BottomNav />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
