<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Admin - Som Tam Thai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
        body { background-color: #f3f4f6; font-family: 'DM Sans', sans-serif; color: #333; }
        .display-font { font-family: 'Lora', serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { cream: '#FDFBF7', green: '#1A4D2E', terracotta: '#E36414', gold: '#FFB703' }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full flex"></div>
    <script type="text/babel">
        const AdminSidebar = ({ currentRoute }) => (
            <aside className="bg-brand-green text-white w-64 flex-shrink-0 hidden md:flex flex-col h-full z-20">
                <div className="p-6 border-b border-white/10 flex items-center gap-3">
                    <div className="w-8 h-8 bg-brand-gold rounded-md flex items-center justify-center text-brand-green font-bold text-xl">S</div>
                    <div>
                        <h1 className="display-font font-bold text-lg leading-tight">Som Tam Thai</h1>
                        <span className="text-[10px] uppercase tracking-widest text-brand-gold font-bold">Admin Panel</span>
                    </div>
                </div>
                <nav className="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
                    {[
                        { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard', link: 'dashboard.html' },
                        { id: 'orders', icon: 'shopping-bag', label: 'Orders', link: 'orders.html' },
                        { id: 'reservations', icon: 'calendar', label: 'Reservations', link: 'reservations.html' },
                        { id: 'menu', icon: 'menu', label: 'Menu', link: 'menu.html' },
                        { id: 'schedule', icon: 'clock', label: 'Schedule', link: 'schedule.html' },
                        { id: 'customers', icon: 'users', label: 'Customers', link: 'customers.html' },
                        { id: 'settings', icon: 'settings', label: 'Settings', link: 'settings.html' }
                    ].map(item => (
                        <a key={item.id} href={item.link} className={`flex items-center justify-between px-3 py-2.5 rounded-lg transition-colors ${currentRoute === item.id ? 'bg-white/10 text-brand-gold font-bold' : 'text-gray-300 hover:bg-white/5 hover:text-white'}`}>
                            <div className="flex items-center">
                                <i data-lucide={item.icon} className={`w-5 h-5 mr-3 ${currentRoute === item.id ? 'text-brand-gold' : 'text-gray-400'}`}></i>
                                {item.label}
                            </div>
                        </a>
                    ))}
                </nav>
                <div className="p-4 border-t border-white/10">
                    <div className="flex items-center gap-3 mb-4 px-2">
                        <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                            <i data-lucide="user" className="w-4 h-4 text-white"></i>
                        </div>
                        <div>
                            <div className="text-sm font-bold">Admin User</div>
                            <div className="text-xs text-gray-400">Restaurant Admin</div>
                        </div>
                    </div>
                    <button className="w-full flex items-center justify-center gap-2 text-sm text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 py-2 rounded transition-colors">
                        <i data-lucide="log-out" className="w-4 h-4"></i> Sign Out
                    </button>
                </div>
            </aside>
        );

        const Toggle = ({ value, onChange }) => (
            <button onClick={() => onChange(!value)} className={`relative inline-flex h-6 w-11 rounded-full transition-colors flex-shrink-0 ${value ? 'bg-brand-green' : 'bg-gray-300'}`}>
                <span className={`inline-block h-5 w-5 rounded-full bg-white shadow transform transition-transform mt-0.5 ${value ? 'translate-x-5' : 'translate-x-0.5'}`}></span>
            </button>
        );

        const SectionCard = ({ title, icon, children }) => (
            <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                <div className="px-6 py-4 border-b border-gray-100 flex items-center gap-2 bg-gray-50">
                    <i data-lucide={icon} className="w-4 h-4 text-brand-terracotta"></i>
                    <h3 className="font-bold text-gray-900">{title}</h3>
                </div>
                <div className="p-6 space-y-5">{children}</div>
            </div>
        );

        const FieldRow = ({ label, hint, children }) => (
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <div className="font-medium text-gray-900 text-sm">{label}</div>
                    {hint && <div className="text-xs text-gray-500 mt-0.5">{hint}</div>}
                </div>
                <div className="sm:w-64 flex-shrink-0">{children}</div>
            </div>
        );

        const App = () => {
            const [restaurant, setRestaurant] = React.useState({
                name: 'Som Tam Thai',
                phone: '+960 789 2616',
                email: 'hello@somtamthai.mv',
                address: 'Izzudhdheen Magu, Maafannu, Malé, Maldives',
                currency: 'MVR',
                timezone: 'Indian/Maldives',
            });
            const [notifications, setNotifications] = React.useState({
                newOrder: true,
                orderReady: true,
                newReservation: true,
                lowStock: false,
                dailyReport: true,
            });
            const [ordering, setOrdering] = React.useState({
                deliveryEnabled: true,
                pickupEnabled: false,
                minOrderAmount: 100,
                deliveryRadius: 3,
                estimatedPrepTime: 25,
            });
            const [activeSection, setActiveSection] = React.useState('restaurant');
            const [saved, setSaved] = React.useState(false);

            React.useEffect(() => { lucide.createIcons(); });

            const handleSave = () => {
                setSaved(true);
                setTimeout(() => setSaved(false), 2500);
            };

            const sections = [
                { id: 'restaurant', icon: 'store', label: 'Restaurant Info' },
                { id: 'ordering', icon: 'shopping-bag', label: 'Ordering' },
                { id: 'notifications', icon: 'bell', label: 'Notifications' },
                { id: 'danger', icon: 'alert-triangle', label: 'Danger Zone' },
            ];

            return (
                <div className="flex w-full h-full">
                    <AdminSidebar currentRoute="settings" />

                    <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
                        <header className="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center flex-shrink-0 shadow-sm">
                            <h2 className="text-xl font-bold text-gray-900">Settings</h2>
                            <button onClick={handleSave} className={`flex items-center px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-all ${saved ? 'bg-green-600 text-white' : 'bg-brand-green text-white hover:bg-green-900'}`}>
                                {saved ? <><i data-lucide="check" className="w-4 h-4 mr-1.5"></i>Saved!</> : <><i data-lucide="save" className="w-4 h-4 mr-1.5"></i>Save Changes</>}
                            </button>
                        </header>

                        <div className="flex-1 overflow-y-auto p-6 flex gap-6">

                            {/* Section Nav */}
                            <nav className="w-48 flex-shrink-0 hidden lg:block">
                                <ul className="space-y-1">
                                    {sections.map(s => (
                                        <li key={s.id}>
                                            <button onClick={() => setActiveSection(s.id)} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-left ${activeSection === s.id ? 'bg-brand-green/10 text-brand-green font-bold' : 'text-gray-600 hover:bg-gray-100'}`}>
                                                <i data-lucide={s.icon} className="w-4 h-4"></i>{s.label}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </nav>

                            {/* Content Panels */}
                            <div className="flex-1 space-y-6 min-w-0">

                                {(activeSection === 'restaurant') && (
                                    <SectionCard title="Restaurant Information" icon="store">
                                        {[
                                            { key: 'name', label: 'Restaurant Name', hint: 'Displayed to customers across the app' },
                                            { key: 'phone', label: 'Contact Phone', hint: 'Used for customer support and orders' },
                                            { key: 'email', label: 'Email Address', hint: 'For order confirmations and receipts' },
                                            { key: 'address', label: 'Physical Address', hint: 'Shown on the customer-facing pages' },
                                        ].map(f => (
                                            <FieldRow key={f.key} label={f.label} hint={f.hint}>
                                                <input
                                                    value={restaurant[f.key]}
                                                    onChange={e => setRestaurant(r => ({ ...r, [f.key]: e.target.value }))}
                                                    className="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-green"
                                                />
                                            </FieldRow>
                                        ))}
                                        <hr className="border-gray-100" />
                                        <FieldRow label="Currency" hint="Applied to all pricing displayed">
                                            <select value={restaurant.currency} onChange={e => setRestaurant(r => ({ ...r, currency: e.target.value }))} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:border-brand-green">
                                                <option value="MVR">MVR — Maldivian Rufiyaa</option>
                                                <option value="USD">USD — US Dollar</option>
                                            </select>
                                        </FieldRow>
                                        <FieldRow label="Timezone" hint="Used for scheduling and order timestamps">
                                            <select value={restaurant.timezone} onChange={e => setRestaurant(r => ({ ...r, timezone: e.target.value }))} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:border-brand-green">
                                                <option value="Indian/Maldives">Indian/Maldives (UTC+5)</option>
                                                <option value="Asia/Colombo">Asia/Colombo (UTC+5:30)</option>
                                                <option value="Asia/Dubai">Asia/Dubai (UTC+4)</option>
                                            </select>
                                        </FieldRow>
                                    </SectionCard>
                                )}

                                {(activeSection === 'ordering') && (
                                    <SectionCard title="Ordering Settings" icon="shopping-bag">
                                        <FieldRow label="Enable Delivery" hint="Allow customers to place delivery orders">
                                            <Toggle value={ordering.deliveryEnabled} onChange={v => setOrdering(o => ({ ...o, deliveryEnabled: v }))} />
                                        </FieldRow>
                                        <FieldRow label="Enable Pickup" hint="Allow customers to collect orders in person">
                                            <Toggle value={ordering.pickupEnabled} onChange={v => setOrdering(o => ({ ...o, pickupEnabled: v }))} />
                                        </FieldRow>
                                        <hr className="border-gray-100" />
                                        <FieldRow label="Minimum Order Amount (MVR)" hint="Orders below this value cannot be placed">
                                            <input type="number" value={ordering.minOrderAmount} onChange={e => setOrdering(o => ({ ...o, minOrderAmount: e.target.value }))} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-green" />
                                        </FieldRow>
                                        <FieldRow label="Delivery Radius (km)" hint="Orders outside this radius are declined">
                                            <input type="number" value={ordering.deliveryRadius} onChange={e => setOrdering(o => ({ ...o, deliveryRadius: e.target.value }))} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-green" />
                                        </FieldRow>
                                        <FieldRow label="Estimated Prep Time (min)" hint="Shown to customers at checkout">
                                            <input type="number" value={ordering.estimatedPrepTime} onChange={e => setOrdering(o => ({ ...o, estimatedPrepTime: e.target.value }))} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-green" />
                                        </FieldRow>
                                    </SectionCard>
                                )}

                                {(activeSection === 'notifications') && (
                                    <SectionCard title="Notification Preferences" icon="bell">
                                        {[
                                            { key: 'newOrder', label: 'New Order Alert', hint: 'Notify when a customer places an order' },
                                            { key: 'orderReady', label: 'Order Ready Alert', hint: 'Notify when kitchen marks an order ready' },
                                            { key: 'newReservation', label: 'New Reservation', hint: 'Notify when a table booking is submitted' },
                                            { key: 'lowStock', label: 'Low Stock Warning', hint: 'Alert when menu items are running low' },
                                            { key: 'dailyReport', label: 'Daily Summary Report', hint: 'Receive a daily revenue and order digest' },
                                        ].map(n => (
                                            <FieldRow key={n.key} label={n.label} hint={n.hint}>
                                                <Toggle value={notifications[n.key]} onChange={v => setNotifications(prev => ({ ...prev, [n.key]: v }))} />
                                            </FieldRow>
                                        ))}
                                    </SectionCard>
                                )}

                                {(activeSection === 'danger') && (
                                    <div className="bg-white rounded-xl border border-red-200 shadow-sm overflow-hidden">
                                        <div className="px-6 py-4 border-b border-red-100 flex items-center gap-2 bg-red-50">
                                            <i data-lucide="alert-triangle" className="w-4 h-4 text-red-500"></i>
                                            <h3 className="font-bold text-red-700">Danger Zone</h3>
                                        </div>
                                        <div className="p-6 space-y-4">
                                            {[
                                                { label: 'Pause All Ordering', desc: 'Temporarily stop customers from placing orders', btn: 'Pause Orders', btnClass: 'border-orange-300 text-orange-700 hover:bg-orange-50' },
                                                { label: 'Clear Today\'s Orders', desc: 'Permanently remove all orders from today\'s record', btn: 'Clear Orders', btnClass: 'border-red-300 text-red-700 hover:bg-red-50' },
                                                { label: 'Reset Menu to Default', desc: 'Revert all menu items to their original state', btn: 'Reset Menu', btnClass: 'border-red-300 text-red-700 hover:bg-red-50' },
                                            ].map((action, i) => (
                                                <div key={i} className="flex items-center justify-between p-4 border border-gray-100 rounded-xl hover:border-red-200 transition-colors">
                                                    <div>
                                                        <div className="font-bold text-gray-900 text-sm">{action.label}</div>
                                                        <div className="text-xs text-gray-500 mt-0.5">{action.desc}</div>
                                                    </div>
                                                    <button className={`text-sm font-bold px-4 py-2 border rounded-lg transition-colors flex-shrink-0 ml-4 ${action.btnClass}`}>
                                                        {action.btn}
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Mobile section tabs */}
                                <div className="lg:hidden flex flex-wrap gap-2 pt-2">
                                    {sections.map(s => (
                                        <button key={s.id} onClick={() => setActiveSection(s.id)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${activeSection === s.id ? 'bg-brand-green text-white' : 'bg-white border border-gray-200 text-gray-600'}`}>
                                            <i data-lucide={s.icon} className="w-3.5 h-3.5"></i>{s.label}
                                        </button>
                                    ))}
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
