<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management - Admin - Som Tam Thai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
        body { background-color: #f3f4f6; font-family: 'DM Sans', sans-serif; color: #333; }
        .display-font { font-family: 'Lora', serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { cream: '#FDFBF7', green: '#1A4D2E', terracotta: '#E36414', gold: '#FFB703' }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full flex"></div>

    <script type="text/babel">
        // --- Dummy Data ---
        const INITIAL_MENU = [
            { id: 1, name: "Authentic Som Tam", category: "Salads", price: 165, spice: 3, available: true, description: "Classic green papaya salad with dried shrimp, peanuts, and bird's eye chili." },
            { id: 2, name: "Green Curry Chicken", category: "Mains", price: 220, spice: 2, available: true, description: "Fragrant green curry with coconut milk, kaffir lime, and tender chicken." },
            { id: 3, name: "Tom Yum Goong", category: "Soups", price: 210, spice: 3, available: true, description: "Hot and sour soup with fresh prawns, lemongrass, galangal, and mushrooms." },
            { id: 4, name: "Pad Thai", category: "Mains", price: 195, spice: 1, available: true, description: "Stir-fried rice noodles with egg, bean sprouts, peanuts, and tamarind sauce." },
            { id: 5, name: "Tom Kha Gai", category: "Soups", price: 185, spice: 1, available: false, description: "Creamy coconut soup with chicken, galangal, mushrooms, and lime leaves." },
            { id: 6, name: "Pad Kra Pao", category: "Mains", price: 190, spice: 3, available: true, description: "Thai basil stir-fry with minced pork, garlic, chili, and a fried egg." },
            { id: 7, name: "Massaman Beef", category: "Mains", price: 260, spice: 1, available: true, description: "Rich slow-cooked beef curry with potatoes, peanuts, and aromatic spices." },
            { id: 8, name: "Mango Sticky Rice", category: "Desserts", price: 110, spice: 0, available: true, description: "Sweet glutinous rice with fresh mango slices and coconut cream." },
            { id: 9, name: "Thai Iced Tea", category: "Drinks", price: 65, spice: 0, available: true, description: "Chilled Thai-spiced tea with sweetened condensed milk." },
        ];

        const CATEGORIES = ["All", "Salads", "Soups", "Mains", "Desserts", "Drinks"];

        const SPICE_LABELS = { 0: "None", 1: "Mild", 2: "Medium", 3: "Hot" };

        // Admin Sidebar
        const AdminSidebar = ({ currentRoute }) => (
            <aside className="bg-brand-green text-white w-64 flex-shrink-0 flex flex-col h-full z-20">
                <div className="p-6 border-b border-white/10 flex items-center gap-3">
                    <div className="w-8 h-8 bg-brand-gold rounded-md flex items-center justify-center text-brand-green font-bold text-xl">S</div>
                    <div>
                        <h1 className="display-font font-bold text-lg leading-tight">Som Tam Thai</h1>
                        <span className="text-[10px] uppercase tracking-widest text-brand-gold font-bold">Admin Panel</span>
                    </div>
                </div>
                <nav className="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
                    {[
                        { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard', link: 'dashboard.html' },
                        { id: 'orders', icon: 'shopping-bag', label: 'Orders', badge: '6', link: 'orders.html' },
                        { id: 'reservations', icon: 'calendar', label: 'Reservations', link: 'reservations.html' },
                        { id: 'menu', icon: 'menu', label: 'Menu', link: 'menu.html' },
                        { id: 'schedule', icon: 'clock', label: 'Schedule', link: 'schedule.html' },
                        { id: 'customers', icon: 'users', label: 'Customers', link: 'customers.html' },
                        { id: 'settings', icon: 'settings', label: 'Settings', link: 'settings.html' }
                    ].map(item => (
                        <a key={item.id} href={item.link} className={`flex items-center justify-between px-3 py-2.5 rounded-lg transition-colors ${currentRoute === item.id ? 'bg-white/10 text-brand-gold font-bold' : 'text-gray-300 hover:bg-white/5 hover:text-white'}`}>
                            <div className="flex items-center">
                                <i data-lucide={item.icon} className={`w-5 h-5 mr-3 ${currentRoute === item.id ? 'text-brand-gold' : 'text-gray-400'}`}></i>
                                {item.label}
                            </div>
                            {item.badge && <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-red-500 text-white">{item.badge}</span>}
                        </a>
                    ))}
                </nav>
                <div className="p-4 border-t border-white/10">
                    <div className="flex items-center gap-3 mb-4 px-2">
                        <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                            <i data-lucide="user" className="w-4 h-4 text-white"></i>
                        </div>
                        <div>
                            <div className="text-sm font-bold">Admin User</div>
                            <div className="text-xs text-gray-400">Restaurant Admin</div>
                        </div>
                    </div>
                    <button className="w-full flex items-center justify-center gap-2 text-sm text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 py-2 rounded transition-colors">
                        <i data-lucide="log-out" className="w-4 h-4"></i> Sign Out
                    </button>
                </div>
            </aside>
        );

        // Item Edit/Create Drawer
        const ItemDrawer = ({ item, onClose, onSave }) => {
            const isNew = !item.id;
            const [form, setForm] = React.useState(item);

            const set = (key, val) => setForm(f => ({ ...f, [key]: val }));

            return (
                <div className="fixed inset-0 bg-black/40 z-50 flex justify-end">
                    <div className="bg-white w-full max-w-md h-full shadow-xl flex flex-col">
                        <div className="bg-brand-green text-white p-6 flex justify-between items-center flex-shrink-0">
                            <h3 className="text-xl font-bold">{isNew ? "Add New Item" : "Edit Item"}</h3>
                            <button onClick={onClose}><i data-lucide="x" className="w-5 h-5 text-white/70 hover:text-white"></i></button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 space-y-4">
                            <div>
                                <label className="text-xs font-bold text-gray-700 block mb-1">Item Name</label>
                                <input value={form.name} onChange={e => set('name', e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-green" />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-700 block mb-1">Description</label>
                                <textarea value={form.description} onChange={e => set('description', e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-green" rows="3"></textarea>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="text-xs font-bold text-gray-700 block mb-1">Category</label>
                                    <select value={form.category} onChange={e => set('category', e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:border-brand-green">
                                        {CATEGORIES.filter(c => c !== "All").map(c => <option key={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-700 block mb-1">Price (MVR)</label>
                                    <input type="number" value={form.price} onChange={e => set('price', Number(e.target.value))} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-green" />
                                </div>
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-700 block mb-2">Spice Level</label>
                                <div className="flex gap-2">
                                    {[0,1,2,3].map(lvl => (
                                        <button key={lvl} onClick={() => set('spice', lvl)} className={`flex-1 py-2 rounded-lg text-xs font-bold border transition-colors ${form.spice === lvl ? 'bg-brand-terracotta text-white border-brand-terracotta' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}`}>
                                            {SPICE_LABELS[lvl]}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100">
                                <div>
                                    <div className="font-bold text-sm text-gray-900">Available on Menu</div>
                                    <div className="text-xs text-gray-500">Customers can order this item</div>
                                </div>
                                <button onClick={() => set('available', !form.available)} className={`relative inline-flex h-6 w-11 rounded-full transition-colors ${form.available ? 'bg-brand-green' : 'bg-gray-300'}`}>
                                    <span className={`inline-block h-5 w-5 rounded-full bg-white shadow transform transition-transform mt-0.5 ${form.available ? 'translate-x-5' : 'translate-x-0.5'}`}></span>
                                </button>
                            </div>
                        </div>

                        <div className="p-6 border-t border-gray-100 flex-shrink-0 flex gap-3">
                            <button onClick={onClose} className="flex-1 border border-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-50 transition-colors text-sm">Discard</button>
                            <button onClick={() => onSave(form)} className="flex-1 bg-brand-green text-white font-bold py-3 rounded-lg hover:bg-green-900 transition-colors text-sm">Save Item</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [menu, setMenu] = React.useState(INITIAL_MENU);
            const [activeCategory, setActiveCategory] = React.useState("All");
            const [showDrawer, setShowDrawer] = React.useState(false);
            const [editingItem, setEditingItem] = React.useState(null);
            const [showDeleteConfirm, setShowDeleteConfirm] = React.useState(false);
            const [deletingId, setDeletingId] = React.useState(null);

            React.useEffect(() => { lucide.createIcons(); });

            const filtered = activeCategory === "All" ? menu : menu.filter(i => i.category === activeCategory);

            const handleEdit = (item) => { setEditingItem({ ...item }); setShowDrawer(true); };
            const handleNew = () => { setEditingItem({ name: "", category: "Mains", price: 0, spice: 0, available: true, description: "" }); setShowDrawer(true); };

            const handleSave = (form) => {
                if (form.id) {
                    setMenu(prev => prev.map(i => i.id === form.id ? form : i));
                } else {
                    setMenu(prev => [...prev, { ...form, id: Date.now() }]);
                }
                setShowDrawer(false);
            };

            const handleToggleAvail = (id) => {
                setMenu(prev => prev.map(i => i.id === id ? { ...i, available: !i.available } : i));
            };

            const handleDelete = () => {
                setMenu(prev => prev.filter(i => i.id !== deletingId));
                setShowDeleteConfirm(false);
            };

            const availableCount = menu.filter(i => i.available).length;
            const unavailableCount = menu.filter(i => !i.available).length;

            return (
                <div className="flex w-full h-full">
                    <AdminSidebar currentRoute="menu" />

                    {showDrawer && editingItem && (
                        <ItemDrawer item={editingItem} onClose={() => setShowDrawer(false)} onSave={handleSave} />
                    )}

                    {showDeleteConfirm && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-6">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">Delete this item?</h3>
                                <p className="text-sm text-gray-500 mb-6">This will permanently remove the menu item and cannot be undone.</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setShowDeleteConfirm(false)} className="px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
                                    <button onClick={handleDelete} className="px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
                        
                        {/* Header */}
                        <header className="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center flex-shrink-0 shadow-sm">
                            <h2 className="text-xl font-bold text-gray-900">Menu Management</h2>
                            <button onClick={handleNew} className="flex items-center px-4 py-2 bg-brand-green text-white rounded-lg text-sm font-bold hover:bg-green-900 shadow-sm transition-colors">
                                <i data-lucide="plus" className="w-4 h-4 mr-1"></i> Add Item
                            </button>
                        </header>

                        <div className="flex-1 overflow-y-auto p-6">

                            {/* Stats Row */}
                            <div className="grid grid-cols-3 gap-4 mb-6">
                                {[
                                    { label: "Total Items", value: menu.length, icon: "utensils", color: "text-brand-green" },
                                    { label: "Available", value: availableCount, icon: "check-circle", color: "text-green-600" },
                                    { label: "Unavailable", value: unavailableCount, icon: "eye-off", color: "text-gray-400" },
                                ].map((s, i) => (
                                    <div key={i} className="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-4">
                                        <div className={`w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center ${s.color}`}>
                                            <i data-lucide={s.icon} className="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <div className="text-2xl font-bold text-gray-900">{s.value}</div>
                                            <div className="text-xs text-gray-500">{s.label}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Category Tabs */}
                            <div className="flex gap-2 mb-5 flex-wrap">
                                {CATEGORIES.map(cat => (
                                    <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-4 py-2 rounded-lg text-sm font-bold transition-colors ${activeCategory === cat ? 'bg-brand-green text-white shadow-sm' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50'}`}>
                                        {cat}
                                        {cat !== "All" && <span className="ml-1.5 text-xs opacity-70">({menu.filter(i => i.category === cat).length})</span>}
                                    </button>
                                ))}
                            </div>

                            {/* Menu Items Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                {filtered.map(item => (
                                    <div key={item.id} className={`bg-white rounded-xl border shadow-sm overflow-hidden transition-all ${item.available ? 'border-gray-100' : 'border-gray-200 opacity-60'}`}>
                                        <div className="p-4">
                                            <div className="flex justify-between items-start mb-2">
                                                <div className="flex-1 mr-3">
                                                    <h3 className="font-bold text-gray-900 text-sm leading-tight">{item.name}</h3>
                                                    <span className="text-xs text-gray-400 font-medium">{item.category}</span>
                                                </div>
                                                <div className="text-right flex-shrink-0">
                                                    <div className="font-bold text-brand-green text-sm">MVR {item.price}</div>
                                                    {item.spice > 0 && (
                                                        <div className="text-[10px] text-brand-terracotta font-bold">{'🌶'.repeat(item.spice)}</div>
                                                    )}
                                                </div>
                                            </div>
                                            <p className="text-xs text-gray-500 leading-relaxed line-clamp-2 mb-4">{item.description}</p>
                                            <div className="flex items-center justify-between pt-3 border-t border-gray-50">
                                                <div className="flex items-center gap-1">
                                                    <button onClick={() => handleToggleAvail(item.id)} className={`relative inline-flex h-5 w-9 rounded-full transition-colors flex-shrink-0 ${item.available ? 'bg-brand-green' : 'bg-gray-300'}`}>
                                                        <span className={`inline-block h-4 w-4 rounded-full bg-white shadow transform transition-transform mt-0.5 ${item.available ? 'translate-x-4' : 'translate-x-0.5'}`}></span>
                                                    </button>
                                                    <span className="text-xs text-gray-500 ml-1">{item.available ? 'Available' : 'Hidden'}</span>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => handleEdit(item)} className="p-1.5 text-gray-400 hover:text-brand-green hover:bg-green-50 rounded transition-colors">
                                                        <i data-lucide="edit-2" className="w-3.5 h-3.5"></i>
                                                    </button>
                                                    <button onClick={() => { setDeletingId(item.id); setShowDeleteConfirm(true); }} className="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded transition-colors">
                                                        <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
