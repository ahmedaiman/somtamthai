<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Admin - Som Tam Thai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
        body { background-color: #f3f4f6; font-family: 'DM Sans', sans-serif; color: #333; }
        .display-font { font-family: 'Lora', serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { cream: '#FDFBF7', green: '#1A4D2E', terracotta: '#E36414', gold: '#FFB703' }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full flex"></div>
    <script type="text/babel">
        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        const INITIAL_SCHEDULE = {
            Monday:    { lunchOpen: true,  lunchStart: '11:30', lunchEnd: '15:30', dinnerOpen: true,  dinnerStart: '18:00', dinnerEnd: '21:30' },
            Tuesday:   { lunchOpen: true,  lunchStart: '11:30', lunchEnd: '15:30', dinnerOpen: true,  dinnerStart: '18:00', dinnerEnd: '21:30' },
            Wednesday: { lunchOpen: true,  lunchStart: '11:30', lunchEnd: '15:30', dinnerOpen: true,  dinnerStart: '18:00', dinnerEnd: '21:30' },
            Thursday:  { lunchOpen: true,  lunchStart: '11:30', lunchEnd: '15:30', dinnerOpen: true,  dinnerStart: '18:00', dinnerEnd: '22:00' },
            Friday:    { lunchOpen: false, lunchStart: '11:30', lunchEnd: '15:30', dinnerOpen: true,  dinnerStart: '17:30', dinnerEnd: '22:30' },
            Saturday:  { lunchOpen: false, lunchStart: '11:30', lunchEnd: '15:30', dinnerOpen: true,  dinnerStart: '17:30', dinnerEnd: '22:30' },
            Sunday:    { lunchOpen: false, lunchStart: '11:30', lunchEnd: '15:30', dinnerOpen: false, dinnerStart: '18:00', dinnerEnd: '21:30' },
        };

        const STAFF = [
            { id: 1, name: 'Aishath Shiyam', role: 'Head Chef', shifts: ['Monday','Tuesday','Wednesday','Thursday','Friday'] },
            { id: 2, name: 'Hassan Ali', role: 'Line Cook', shifts: ['Monday','Tuesday','Thursday','Friday','Saturday'] },
            { id: 3, name: 'Mariyam Latheef', role: 'Front of House', shifts: ['Tuesday','Wednesday','Thursday','Friday','Saturday'] },
            { id: 4, name: 'Ibrahim Waheed', role: 'Delivery Rider', shifts: ['Wednesday','Thursday','Friday','Saturday','Sunday'] },
            { id: 5, name: 'Fatima Rashid', role: 'Cashier', shifts: ['Monday','Wednesday','Friday','Saturday'] },
        ];

        const TIMES = ['11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00','22:30'];

        const AdminSidebar = ({ currentRoute }) => (
            <aside className="bg-brand-green text-white w-64 flex-shrink-0 hidden md:flex flex-col h-full z-20">
                <div className="p-6 border-b border-white/10 flex items-center gap-3">
                    <div className="w-8 h-8 bg-brand-gold rounded-md flex items-center justify-center text-brand-green font-bold text-xl">S</div>
                    <div>
                        <h1 className="display-font font-bold text-lg leading-tight">Som Tam Thai</h1>
                        <span className="text-[10px] uppercase tracking-widest text-brand-gold font-bold">Admin Panel</span>
                    </div>
                </div>
                <nav className="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
                    {[
                        { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard', link: 'dashboard.html' },
                        { id: 'orders', icon: 'shopping-bag', label: 'Orders', link: 'orders.html' },
                        { id: 'reservations', icon: 'calendar', label: 'Reservations', link: 'reservations.html' },
                        { id: 'menu', icon: 'menu', label: 'Menu', link: 'menu.html' },
                        { id: 'schedule', icon: 'clock', label: 'Schedule', link: 'schedule.html' },
                        { id: 'customers', icon: 'users', label: 'Customers', link: 'customers.html' },
                        { id: 'settings', icon: 'settings', label: 'Settings', link: 'settings.html' }
                    ].map(item => (
                        <a key={item.id} href={item.link} className={`flex items-center justify-between px-3 py-2.5 rounded-lg transition-colors ${currentRoute === item.id ? 'bg-white/10 text-brand-gold font-bold' : 'text-gray-300 hover:bg-white/5 hover:text-white'}`}>
                            <div className="flex items-center">
                                <i data-lucide={item.icon} className={`w-5 h-5 mr-3 ${currentRoute === item.id ? 'text-brand-gold' : 'text-gray-400'}`}></i>
                                {item.label}
                            </div>
                        </a>
                    ))}
                </nav>
                <div className="p-4 border-t border-white/10">
                    <div className="flex items-center gap-3 mb-4 px-2">
                        <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                            <i data-lucide="user" className="w-4 h-4 text-white"></i>
                        </div>
                        <div>
                            <div className="text-sm font-bold">Admin User</div>
                            <div className="text-xs text-gray-400">Restaurant Admin</div>
                        </div>
                    </div>
                    <button className="w-full flex items-center justify-center gap-2 text-sm text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 py-2 rounded transition-colors">
                        <i data-lucide="log-out" className="w-4 h-4"></i> Sign Out
                    </button>
                </div>
            </aside>
        );

        const App = () => {
            const [schedule, setSchedule] = React.useState(INITIAL_SCHEDULE);
            const [activeTab, setActiveTab] = React.useState('hours');
            const [saved, setSaved] = React.useState(false);

            React.useEffect(() => { lucide.createIcons(); });

            const updateDay = (day, field, value) => {
                setSchedule(prev => ({ ...prev, [day]: { ...prev[day], [field]: value } }));
            };

            const handleSave = () => {
                setSaved(true);
                setTimeout(() => setSaved(false), 2500);
            };

            return (
                <div className="flex w-full h-full">
                    <AdminSidebar currentRoute="schedule" />

                    <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
                        <header className="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center flex-shrink-0 shadow-sm">
                            <h2 className="text-xl font-bold text-gray-900">Schedule & Hours</h2>
                            <button onClick={handleSave} className={`flex items-center px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-all ${saved ? 'bg-green-600 text-white' : 'bg-brand-green text-white hover:bg-green-900'}`}>
                                {saved ? <><i data-lucide="check" className="w-4 h-4 mr-1.5"></i>Saved!</> : <><i data-lucide="save" className="w-4 h-4 mr-1.5"></i>Save Changes</>}
                            </button>
                        </header>

                        <div className="flex-1 overflow-y-auto p-6">

                            {/* Tab Toggle */}
                            <div className="flex gap-2 mb-6">
                                {[['hours','clock','Operating Hours'], ['staff','users','Staff Roster']].map(([id, icon, label]) => (
                                    <button key={id} onClick={() => setActiveTab(id)} className={`flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition-colors ${activeTab === id ? 'bg-brand-green text-white shadow-sm' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50'}`}>
                                        <i data-lucide={icon} className="w-4 h-4"></i>{label}
                                    </button>
                                ))}
                            </div>

                            {activeTab === 'hours' && (
                                <div className="space-y-3">
                                    {DAYS.map(day => {
                                        const d = schedule[day];
                                        const isFullyClosed = !d.lunchOpen && !d.dinnerOpen;
                                        return (
                                            <div key={day} className={`bg-white rounded-xl border shadow-sm overflow-hidden transition-opacity ${isFullyClosed ? 'opacity-60' : ''}`}>
                                                <div className="px-5 py-3 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                                                    <span className="font-bold text-gray-900 w-28">{day}</span>
                                                    {isFullyClosed && <span className="text-xs font-bold text-red-500 uppercase tracking-wider bg-red-50 px-2 py-1 rounded-full">Closed</span>}
                                                </div>
                                                <div className="px-5 py-4 grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    {/* Lunch */}
                                                    <div className="flex items-center gap-4">
                                                        <button onClick={() => updateDay(day, 'lunchOpen', !d.lunchOpen)} className={`relative inline-flex h-6 w-11 rounded-full transition-colors flex-shrink-0 ${d.lunchOpen ? 'bg-brand-green' : 'bg-gray-300'}`}>
                                                            <span className={`inline-block h-5 w-5 rounded-full bg-white shadow transform transition-transform mt-0.5 ${d.lunchOpen ? 'translate-x-5' : 'translate-x-0.5'}`}></span>
                                                        </button>
                                                        <div className="flex-1">
                                                            <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Lunch</div>
                                                            <div className="flex items-center gap-2">
                                                                <select value={d.lunchStart} onChange={e => updateDay(day, 'lunchStart', e.target.value)} disabled={!d.lunchOpen} className="border border-gray-200 rounded-lg p-1.5 text-sm bg-white focus:outline-none focus:border-brand-green disabled:opacity-40 disabled:cursor-not-allowed">
                                                                    {TIMES.map(t => <option key={t}>{t}</option>)}
                                                                </select>
                                                                <span className="text-gray-400 text-sm">–</span>
                                                                <select value={d.lunchEnd} onChange={e => updateDay(day, 'lunchEnd', e.target.value)} disabled={!d.lunchOpen} className="border border-gray-200 rounded-lg p-1.5 text-sm bg-white focus:outline-none focus:border-brand-green disabled:opacity-40 disabled:cursor-not-allowed">
                                                                    {TIMES.map(t => <option key={t}>{t}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    {/* Dinner */}
                                                    <div className="flex items-center gap-4">
                                                        <button onClick={() => updateDay(day, 'dinnerOpen', !d.dinnerOpen)} className={`relative inline-flex h-6 w-11 rounded-full transition-colors flex-shrink-0 ${d.dinnerOpen ? 'bg-brand-green' : 'bg-gray-300'}`}>
                                                            <span className={`inline-block h-5 w-5 rounded-full bg-white shadow transform transition-transform mt-0.5 ${d.dinnerOpen ? 'translate-x-5' : 'translate-x-0.5'}`}></span>
                                                        </button>
                                                        <div className="flex-1">
                                                            <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Dinner</div>
                                                            <div className="flex items-center gap-2">
                                                                <select value={d.dinnerStart} onChange={e => updateDay(day, 'dinnerStart', e.target.value)} disabled={!d.dinnerOpen} className="border border-gray-200 rounded-lg p-1.5 text-sm bg-white focus:outline-none focus:border-brand-green disabled:opacity-40 disabled:cursor-not-allowed">
                                                                    {TIMES.map(t => <option key={t}>{t}</option>)}
                                                                </select>
                                                                <span className="text-gray-400 text-sm">–</span>
                                                                <select value={d.dinnerEnd} onChange={e => updateDay(day, 'dinnerEnd', e.target.value)} disabled={!d.dinnerOpen} className="border border-gray-200 rounded-lg p-1.5 text-sm bg-white focus:outline-none focus:border-brand-green disabled:opacity-40 disabled:cursor-not-allowed">
                                                                    {TIMES.map(t => <option key={t}>{t}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {activeTab === 'staff' && (
                                <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                                    {/* Week grid header */}
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm min-w-[700px]">
                                            <thead className="bg-gray-50 border-b border-gray-100">
                                                <tr>
                                                    <th className="px-5 py-3 text-left font-bold text-gray-700 w-48">Staff Member</th>
                                                    {DAYS.map(d => (
                                                        <th key={d} className="px-2 py-3 text-center font-bold text-gray-700 text-xs">{d.slice(0,3)}</th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-50">
                                                {STAFF.map(member => (
                                                    <tr key={member.id} className="hover:bg-gray-50 transition-colors">
                                                        <td className="px-5 py-3.5">
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-8 h-8 rounded-full bg-brand-green/10 text-brand-green flex items-center justify-center font-bold text-sm">
                                                                    {member.name[0]}
                                                                </div>
                                                                <div>
                                                                    <div className="font-bold text-gray-900 text-sm">{member.name}</div>
                                                                    <div className="text-xs text-gray-500">{member.role}</div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        {DAYS.map(day => (
                                                            <td key={day} className="px-2 py-3.5 text-center">
                                                                {member.shifts.includes(day) ? (
                                                                    <span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-brand-green/10 text-brand-green">
                                                                        <i data-lucide="check" className="w-3.5 h-3.5"></i>
                                                                    </span>
                                                                ) : (
                                                                    <span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-gray-100 text-gray-300">
                                                                        <i data-lucide="minus" className="w-3.5 h-3.5"></i>
                                                                    </span>
                                                                )}
                                                            </td>
                                                        ))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="px-5 py-4 border-t border-gray-100 bg-gray-50">
                                        <button className="flex items-center gap-2 text-sm font-bold text-brand-green hover:text-green-900 transition-colors">
                                            <i data-lucide="plus" className="w-4 h-4"></i> Add Staff Member
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
