<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Table - Som Tam Thai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Task 1-0.1: Design Tokens & Theme File */
        :root {
            --bg-cream: #FDFBF7;
            --primary-green: #1A4D2E;
            --accent-terracotta: #E36414;
            --highlight-gold: #FFB703;
        }
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
        
        body { 
            background-color: var(--bg-cream); 
            font-family: 'DM Sans', sans-serif; 
            color: #333;
        }
        .display-font { 
            font-family: 'Lora', serif; 
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cream: '#FDFBF7',
                            green: '#1A4D2E',
                            terracotta: '#E36414',
                            gold: '#FFB703'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { Calendar, Clock, Users, CheckCircle2, X, Info, ChevronDown } = lucide;

        // Dummy Data
        const USER_PROFILE = { name: "Ahmed", phone: "+960 789 2616" };
        
        const PAST_RESERVATIONS = [
            { id: "RES-2026-0310", date: "10 Mar 2026", time: "19:30", party: 2, status: "Completed" },
            { id: "RES-2026-0214", date: "14 Feb 2026", time: "20:00", party: 4, status: "Completed" },
            { id: "RES-2026-0105", date: "05 Jan 2026", time: "13:00", party: 3, status: "No-Show" },
        ];

        const LUNCH_SLOTS = ['11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00'];
        const DINNER_SLOTS = ['18:00', '18:30', '19:00', '19:30', '20:00', '20:30'];

        const getDummyTableAvailability = (time) => {
            if (!time) return [0, 0, 0];
            if (time === '19:30' || time === '13:00') return [1, 1, 0];
            if (time === '20:00' || time === '13:30') return [1, 1, 1];
            if (time === '18:30') return [1, 0, 0];
            return [0, 0, 0];
        };

        // Reused NavBar Component
        const NavBar = () => (
            <nav className="sticky top-0 z-50 bg-white shadow-sm px-4 py-3 flex justify-between items-center border-b border-gray-100">
                <div className="flex items-center gap-2">
                    <span className="display-font font-bold text-xl text-brand-green">Som Tam Thai</span>
                </div>
                <div className="hidden md:flex gap-6 font-medium text-sm">
                    <a href="index.html" className="text-gray-500 hover:text-brand-terracotta transition-colors">Menu</a>
                    <a href="reservations.html" className="text-brand-terracotta border-b-2 border-brand-terracotta pb-1">Reservations</a>
                    <a href="orders.html" className="hover:text-brand-terracotta transition-colors">Orders</a>
                    <a href="account.html" className="hover:text-brand-terracotta transition-colors">Account</a>
                </div>
                <div className="flex items-center gap-4">
                    <a href="cart.html" className="relative p-2 text-gray-500 hover:text-brand-green">
                        <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                    </a>
                </div>
            </nav>
        );

        // Task 1-4.1: Table Availability Visualizer Component
        const TableAvailabilityVisualizer = ({ time }) => {
            const tableStates = getDummyTableAvailability(time);
            const isFull = tableStates.every(state => state === 1);

            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
                    <h3 className="font-bold text-gray-900 mb-4 flex items-center justify-between">
                        <span>Table Availability</span>
                        {time && (
                            <span className="text-sm font-normal text-gray-500 bg-gray-100 px-2 py-1 rounded">For {time}</span>
                        )}
                    </h3>
                    
                    <div className="flex justify-around items-center py-4 mb-4">
                        {tableStates.map((state, idx) => (
                            <div key={idx} className="flex flex-col items-center group relative cursor-help">
                                <div className={`w-16 h-16 rounded-full border-4 flex items-center justify-center mb-2 transition-colors ${state === 0 ? 'border-brand-green bg-green-50' : 'border-amber-400 bg-amber-50'}`}>
                                    <div className={`w-8 h-8 rounded-full ${state === 0 ? 'bg-brand-green' : 'bg-amber-400'}`}></div>
                                </div>
                                <span className="text-xs font-bold text-gray-700">Table {idx + 1}</span>
                                
                                {/* Tooltip */}
                                <div className="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
                                    {state === 0 ? 'Available' : 'Reserved'}
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="flex justify-center gap-4 text-xs font-medium text-gray-500 border-t border-gray-100 pt-4">
                        <div className="flex items-center"><div className="w-3 h-3 rounded-full bg-brand-green mr-1.5"></div> Available</div>
                        <div className="flex items-center"><div className="w-3 h-3 rounded-full bg-amber-400 mr-1.5"></div> Reserved</div>
                    </div>

                    {isFull && time && (
                        <div className="mt-4 bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100 flex items-start">
                            <i data-lucide="info" className="w-4 h-4 mr-2 mt-0.5 flex-shrink-0"></i>
                            This time slot is fully booked. Please select another time.
                        </div>
                    )}
                    <p className="text-center text-xs text-gray-400 mt-4 italic">Note: Max. 3 tables available for advance reservation.</p>
                </div>
            );
        };

        // Task 1-4.2: Time Slot Selector Component
        const TimeSlotSelector = ({ selectedTime, onSelectTime, date }) => {
            const isToday = date === new Date().toISOString().split('T')[0];
            const currentHour = 14; // Simulated current hour for wiremock

            const renderSlots = (slots) => (
                <div className="grid grid-cols-4 gap-2">
                    {slots.map(slot => {
                        const hour = parseInt(slot.split(':')[0]);
                        const isPast = isToday && hour <= currentHour;
                        const tableStates = getDummyTableAvailability(slot);
                        const isFull = tableStates.every(state => state === 1);
                        
                        const isUnavailable = isPast || isFull;
                        const isSelected = selectedTime === slot;

                        let buttonClass = "py-2.5 text-sm rounded-lg font-medium border transition-colors relative ";
                        
                        if (isUnavailable) {
                            buttonClass += "bg-gray-50 border-gray-200 text-gray-400 cursor-not-allowed line-through decoration-gray-300";
                        } else if (isSelected) {
                            buttonClass += "bg-brand-green border-brand-green text-white shadow-sm";
                        } else {
                            buttonClass += "bg-white border-gray-300 text-gray-700 hover:border-brand-green hover:text-brand-green";
                        }

                        return (
                            <button 
                                key={slot}
                                disabled={isUnavailable}
                                onClick={() => onSelectTime(slot)}
                                className={buttonClass}
                            >
                                {slot}
                                {isFull && !isPast && <span className="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full no-underline">FULL</span>}
                            </button>
                        );
                    })}
                </div>
            );

            return (
                <div className="space-y-6">
                    <div>
                        <h4 className="text-sm font-bold text-gray-700 mb-3 flex items-center">
                            <i data-lucide="clock" className="w-4 h-4 mr-1.5 text-brand-terracotta"></i> Lunch Service
                        </h4>
                        {renderSlots(LUNCH_SLOTS)}
                    </div>
                    <div>
                        <h4 className="text-sm font-bold text-gray-700 mb-3 flex items-center">
                            <i data-lucide="clock" className="w-4 h-4 mr-1.5 text-brand-terracotta"></i> Dinner Service
                        </h4>
                        {renderSlots(DINNER_SLOTS)}
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const today = new Date().toISOString().split('T')[0];
            const [date, setDate] = React.useState(today);
            const [time, setTime] = React.useState('');
            const [partySize, setPartySize] = React.useState('2');
            const [name, setName] = React.useState(USER_PROFILE.name);
            const [requests, setRequests] = React.useState('');
            
            const [showConfirmToast, setShowConfirmToast] = React.useState(false);
            const [upcomingReservation, setUpcomingReservation] = React.useState({
                id: "RES-2026-0417",
                date: "17 Apr 2026",
                time: "19:00",
                party: 2,
                table: "Table 1"
            });
            const [showCancelDialog, setShowCancelDialog] = React.useState(false);

            React.useEffect(() => {
                lucide.createIcons();
            });

            const handleBookingSubmit = (e) => {
                e.preventDefault();
                if (!time) {
                    alert("Please select a time slot.");
                    return;
                }
                const tableStates = getDummyTableAvailability(time);
                if (tableStates.every(state => state === 1)) {
                    alert("This time slot is fully booked.");
                    return;
                }

                setUpcomingReservation({
                    id: "RES-" + Math.floor(Math.random() * 10000) + "-" + Math.floor(Math.random() * 1000),
                    date: new Date(date + 'T12:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
                    time: time,
                    party: parseInt(partySize),
                    table: "Table " + (tableStates.indexOf(0) + 1)
                });
                setShowConfirmToast(true);
                setTime('');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => setShowConfirmToast(false), 5000);
            };

            const handleCancelReservation = () => {
                setUpcomingReservation(null);
                setShowCancelDialog(false);
            };

            return (
                <div className="min-h-screen flex flex-col bg-brand-cream relative">
                    <NavBar />

                    {/* Booking Confirmation Toast */}
                    {showConfirmToast && (
                        <div className="fixed top-20 right-4 bg-white border-l-4 border-brand-green shadow-lg rounded p-4 z-50 flex items-start max-w-sm">
                            <i data-lucide="check-circle-2" className="w-5 h-5 text-brand-green mr-3 mt-0.5 flex-shrink-0"></i>
                            <div>
                                <h4 className="font-bold text-gray-900 text-sm">Booking Confirmed!</h4>
                                <p className="text-xs text-gray-500 mt-1">ID: {upcomingReservation?.id}. A confirmation SMS has been sent.</p>
                            </div>
                            <button onClick={() => setShowConfirmToast(false)} className="ml-4 text-gray-400 hover:text-gray-600"><i data-lucide="x" className="w-4 h-4"></i></button>
                        </div>
                    )}

                    {/* Cancel Dialog Modal */}
                    {showCancelDialog && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
                                <h3 className="text-xl font-bold text-gray-900 mb-2">Cancel Reservation?</h3>
                                <p className="text-gray-600 text-sm mb-6">Are you sure you want to cancel your reservation for {upcomingReservation?.date} at {upcomingReservation?.time}? This action cannot be undone.</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setShowCancelDialog(false)} className="px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Keep It</button>
                                    <button onClick={handleCancelReservation} className="px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors">Yes, Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
                        <div className="mb-8">
                            <h1 className="display-font text-3xl md:text-4xl font-bold text-gray-900">Book a Table</h1>
                            <p className="text-gray-500 mt-2">Reserve your spot for an authentic Thai dining experience.</p>
                        </div>

                        {/* Two-Column Layout */}
                        <div className="flex flex-col lg:flex-row gap-8 lg:gap-12">
                            
                            {/* Left Column: Booking Form */}
                            <div className="w-full lg:w-3/5">
                                <form onSubmit={handleBookingSubmit} className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sm:p-8">
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                        {/* Date Picker */}
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">Date</label>
                                            <div className="relative">
                                                <input 
                                                    type="date" 
                                                    value={date}
                                                    min={today}
                                                    onChange={(e) => { setDate(e.target.value); setTime(''); }}
                                                    className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:border-brand-green focus:ring-1 focus:ring-brand-green focus:outline-none pl-10 bg-white" 
                                                    required
                                                />
                                                <i data-lucide="calendar" className="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5 pointer-events-none"></i>
                                            </div>
                                        </div>

                                        {/* Party Size */}
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">Party Size</label>
                                            <div className="relative">
                                                <select 
                                                    value={partySize}
                                                    onChange={(e) => setPartySize(e.target.value)}
                                                    className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:border-brand-green focus:ring-1 focus:ring-brand-green focus:outline-none pl-10 appearance-none bg-white cursor-pointer"
                                                >
                                                    {[1,2,3,4,5,6,7,8].map(num => <option key={num} value={num}>{num} {num === 1 ? 'Person' : 'People'}</option>)}
                                                </select>
                                                <i data-lucide="users" className="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5 pointer-events-none"></i>
                                                <i data-lucide="chevron-down" className="w-4 h-4 text-gray-400 absolute right-3.5 top-3.5 pointer-events-none"></i>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Time Slots */}
                                    <div className="mb-8">
                                        <label className="block text-sm font-bold text-gray-700 mb-4 border-b border-gray-100 pb-2">Select Time</label>
                                        <TimeSlotSelector date={date} selectedTime={time} onSelectTime={setTime} />
                                    </div>

                                    {/* Additional Details */}
                                    <div className="space-y-4 border-t border-gray-100 pt-6">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">Reservation Name</label>
                                            <input type="text" value={name} onChange={(e) => setName(e.target.value)} required className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:border-brand-green focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">Special Requests <span className="text-gray-400 font-normal">(Optional)</span></label>
                                            <textarea 
                                                rows="2" 
                                                value={requests}
                                                onChange={(e) => setRequests(e.target.value)}
                                                placeholder="Allergies, high chair required, celebrating a birthday?"
                                                className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:border-brand-green focus:outline-none"
                                            ></textarea>
                                        </div>
                                    </div>

                                    <button type="submit" className="w-full mt-8 bg-brand-green hover:bg-green-900 text-white font-bold py-4 px-4 rounded-lg shadow-sm transition-colors flex justify-center items-center text-lg">
                                        Confirm Booking
                                    </button>
                                </form>
                            </div>

                            {/* Right Column: Visualizer & Upcoming/History */}
                            <div className="w-full lg:w-2/5 flex flex-col gap-6">
                                
                                <TableAvailabilityVisualizer time={time} />

                                {/* Upcoming Reservation Card */}
                                {upcomingReservation && (
                                    <div className="bg-brand-green text-white rounded-xl shadow-md overflow-hidden relative">
                                        <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mr-10 -mt-10"></div>
                                        <div className="p-6 relative z-10">
                                            <div className="flex justify-between items-start mb-6">
                                                <div>
                                                    <h3 className="text-brand-gold text-xs font-bold uppercase tracking-wider mb-1">Upcoming Reservation</h3>
                                                    <div className="text-xl font-bold">{upcomingReservation.date}</div>
                                                </div>
                                                <span className="bg-white/20 text-white text-xs px-2.5 py-1 rounded font-medium backdrop-blur-sm">Confirmed</span>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-4 mb-6">
                                                <div>
                                                    <div className="text-brand-cream/60 text-xs mb-1">Time</div>
                                                    <div className="font-medium flex items-center"><i data-lucide="clock" className="w-4 h-4 mr-1 text-brand-gold"></i> {upcomingReservation.time}</div>
                                                </div>
                                                <div>
                                                    <div className="text-brand-cream/60 text-xs mb-1">Party Size</div>
                                                    <div className="font-medium flex items-center"><i data-lucide="users" className="w-4 h-4 mr-1 text-brand-gold"></i> {upcomingReservation.party} People</div>
                                                </div>
                                                <div>
                                                    <div className="text-brand-cream/60 text-xs mb-1">Assignment</div>
                                                    <div className="font-medium">{upcomingReservation.table}</div>
                                                </div>
                                                <div>
                                                    <div className="text-brand-cream/60 text-xs mb-1">Booking ID</div>
                                                    <div className="font-medium text-sm">{upcomingReservation.id}</div>
                                                </div>
                                            </div>

                                            <button onClick={() => setShowCancelDialog(true)} className="w-full py-2.5 bg-white/10 hover:bg-white/20 text-brand-cream text-sm font-bold rounded transition-colors text-center border border-white/20">
                                                Cancel Reservation
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Past Reservations Table (Task 1-4.3) */}
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                                    <h3 className="font-bold text-gray-900 mb-4">Past Reservations</h3>
                                    
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="text-xs text-gray-500 uppercase bg-gray-50 border-y border-gray-200">
                                                <tr>
                                                    <th className="px-3 py-3">Date &amp; Time</th>
                                                    <th className="px-3 py-3 text-center">Party</th>
                                                    <th className="px-3 py-3 text-right">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {PAST_RESERVATIONS.map((res) => (
                                                    <tr key={res.id} className="border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors">
                                                        <td className="px-3 py-3 whitespace-nowrap">
                                                            <div className="font-medium text-gray-900">{res.date}</div>
                                                            <div className="text-gray-500 text-xs">{res.time}</div>
                                                        </td>
                                                        <td className="px-3 py-3 text-center text-gray-600 font-medium">{res.party}</td>
                                                        <td className="px-3 py-3 text-right">
                                                            <span className={`inline-flex px-2 py-0.5 text-[10px] font-bold uppercase rounded-full tracking-wider ${
                                                                res.status === 'Completed' ? 'bg-gray-100 text-gray-600' : 'bg-red-50 text-red-600'
                                                            }`}>
                                                                {res.status}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
